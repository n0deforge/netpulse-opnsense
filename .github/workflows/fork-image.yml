name: fork-image

# Fork-only image pipeline (docs/fork-opnsense.md). Upstream's docker.yml
# publishes on v* tags; this fork tags its releases n0de/vX.Y.Z so the
# upstream release, OpenWrt and Docker workflows never fire here. This
# workflow builds the same Dockerfile for those tags and pushes
# ghcr.io/<owner>/<repo>:X.Y.Z and :latest with the built-in token.

on:
  push:
    tags: ['n0de/v*']
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Upstream release this fork is rebased on. Bump it after a rebase.
  UPSTREAM_BASE: '2.53.0'

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image and version
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -e
          IMAGE="$REGISTRY/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "agent=$(tr -d '[:space:]' < agent/VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = 'tag' ]; then
            FORK="${GITHUB_REF_NAME#n0de/v}"
            echo "version=$UPSTREAM_BASE+n0de.$FORK" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "$IMAGE:$FORK"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "version=$UPSTREAM_BASE+n0de.edge" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_COMMIT=${{ steps.meta.outputs.commit }}
            AGENT_VERSION=${{ steps.meta.outputs.agent }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
